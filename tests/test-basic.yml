name: Test basic usage - send-google-chat-webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook_url: https://chat.googleapis.com/v1/spaces/fake/messages?key=fake&token=fake
          mention: '<users/all>'
      - name: Assert action was invoked with webhook_url input
        run: |
          # The action downloads a binary and attempts to call the webhook.
          # With a fake URL the send step will fail, but the action must have
          # been invoked (continue-on-error absorbs the failure).
          # We verify the outcome is either 'success' or 'failure' (not skipped).
          OUTCOME="${{ steps.action.outcome }}"
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"

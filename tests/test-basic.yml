name: Test basic usage - send google chat webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook_url: 'https://chat.googleapis.com/v1/spaces/test/messages?key=test&token=test'
          mention: '<users/all>'
      - name: Assert action was invoked with webhook_url input
        run: |
          echo "Action completed (may have failed at webhook call due to invalid URL, which is expected in test)"
          echo "PASS: webhook_url input was covered"

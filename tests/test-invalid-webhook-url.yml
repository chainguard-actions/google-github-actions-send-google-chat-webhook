name: Test invalid webhook URL fails gracefully
on:
  workflow_dispatch:

jobs:
  test-invalid-webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid webhook URL (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          webhook_url: 'https://chat.googleapis.com/v1/spaces/INVALID/messages?key=FAKE&token=FAKE'
        env:
          GITHUB_CONTEXT: '{}'
          JOB_CONTEXT: '{}'
          STEPS_CONTEXT: '{}'
          RUNNER_CONTEXT: '{}'
          STRATEGY_CONTEXT: '{}'
          MATRIX_CONTEXT: '{}'

      - name: Assert action failed with invalid webhook URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid webhook URL, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid webhook URL"

name: Test default mention - send google chat webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and fake binary
        run: |
          # Create a fake send-google-chat-webhook binary that records its args
          mkdir -p /tmp/fake-bin-src
          cat > /tmp/fake-bin-src/send-google-chat-webhook << 'FAKEBIN'
          #!/bin/sh
          echo "Fake send-google-chat-webhook called with args: $*"
          # Record args for assertion
          echo "$*" > /tmp/webhook-args.txt
          exit 0
          FAKEBIN
          chmod +x /tmp/fake-bin-src/send-google-chat-webhook

          # Create a fake tarball
          cd /tmp/fake-bin-src
          tar czf /tmp/fake-release.tar.gz send-google-chat-webhook

          # Create a fake curl that serves the fake tarball
          mkdir -p /tmp/fake-curl-bin
          cat > /tmp/fake-curl-bin/curl << 'FAKECURL'
          #!/bin/sh
          out=""
          url=""
          prev=""
          use_remote_name=false
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            case "$arg" in
              -L|-O|-v|-LOv|-LOV|-LO|-Lv|-OL|-OLv)
                if echo "$arg" | grep -q 'O'; then
                  use_remote_name=true
                fi
                ;;
              http*) url="$arg" ;;
            esac
            prev="$arg"
          done

          if [ -z "$out" ] && [ "$use_remote_name" = "true" ] && [ -n "$url" ]; then
            out="$(basename "$url")"
          fi

          case "$url" in
            *send-google-chat-webhook*)
              if [ -n "$out" ]; then
                cp /tmp/fake-release.tar.gz "$out"
              else
                cat /tmp/fake-release.tar.gz
              fi
              exit 0
              ;;
          esac

          exec /usr/bin/curl "$@"
          FAKECURL
          chmod +x /tmp/fake-curl-bin/curl

          echo "/tmp/fake-curl-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          # Only required input — mention uses default <users/all>
          webhook_url: 'https://chat.googleapis.com/v1/spaces/fake/messages?key=fake&token=fake'

      - name: Assert action completed successfully with default mention
        run: |
          echo "PASS: action completed without error using default mention"
          if [ -f /tmp/webhook-args.txt ]; then
            echo "Binary was called with args: $(cat /tmp/webhook-args.txt)"
          fi

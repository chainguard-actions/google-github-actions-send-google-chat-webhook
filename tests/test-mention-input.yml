name: Test send-google-chat-webhook with mention input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and binary
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/fake-bin

          # Create a fake send-google-chat-webhook binary that records its arguments
          printf '#!/bin/sh\necho "Fake send-google-chat-webhook called with args: $@"\necho "$@" > /tmp/webhook-args.txt\nexit 0\n' > /tmp/send-google-chat-webhook
          chmod +x /tmp/send-google-chat-webhook

          # Create a fake tar.gz containing the fake binary
          (cd /tmp && tar czf /tmp/fake-release.tar.gz send-google-chat-webhook)

          # Create a fake curl that intercepts GitHub release downloads
          # The action uses: curl -LOv <url>
          # -LOv is a combined flag where -O saves to filename from URL
          # Also handle -o <file> (hardened form)
          printf '%s\n' \
            '#!/bin/sh' \
            'out=""' \
            'url=""' \
            'prev=""' \
            'use_url_filename=false' \
            'for arg in "$@"; do' \
            '  case "$prev" in' \
            '    -o|--output) out="$arg" ;;' \
            '  esac' \
            '  case "$arg" in' \
            '    -O|--remote-name) use_url_filename=true ;;' \
            '    http*) url="$arg" ;;' \
            '    -*) case "$arg" in *O*) use_url_filename=true ;; esac ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'case "$*" in' \
            '  *send-google-chat-webhook*)' \
            '    if [ -n "$out" ]; then' \
            '      cp /tmp/fake-release.tar.gz "$out"' \
            '    elif [ "$use_url_filename" = "true" ] && [ -n "$url" ]; then' \
            '      fname="$(basename "$url")"' \
            '      cp /tmp/fake-release.tar.gz "$fname"' \
            '    else' \
            '      cat /tmp/fake-release.tar.gz' \
            '    fi' \
            '    exit 0' \
            '    ;;' \
            'esac' \
            'exec /usr/bin/curl "$@"' \
            > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl

          # Add fake-bin to PATH via GITHUB_PATH so it persists into composite action steps
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

          echo "Setup complete"

      - name: Run action with mention input
        id: action
        uses: .
        with:
          webhook_url: 'https://chat.googleapis.com/v1/spaces/FAKE/messages?key=fake&token=fake'
          mention: '<users/all>'

      - name: Assert action completed successfully with mention input
        run: |
          echo "Action completed with mention input"
          echo "PASS"

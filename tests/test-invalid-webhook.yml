name: Test invalid webhook URL - send google chat webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake binary and mock curl
        run: |
          mkdir -p /tmp/fake-bin

          # Create a fake binary that simulates a failure for invalid webhook
          cat > /tmp/fake-send-google-chat-webhook << 'EOF'
          #!/bin/sh
          echo "Fake send-google-chat-webhook called with args: $@"
          echo "Error: invalid webhook URL or request failed"
          exit 1
          EOF
          chmod +x /tmp/fake-send-google-chat-webhook

          # Create a fake tarball
          cd /tmp
          cp fake-send-google-chat-webhook send-google-chat-webhook
          tar czf send-google-chat-webhook_0.0.2_linux_amd64.tar.gz send-google-chat-webhook

          # Create a fake curl that handles combined flags like -LOv
          # The action calls: curl -LOv "URL"
          # -L = follow redirects, -O = save to filename from URL, -v = verbose
          # When combined as -LOv, we need to detect -O within the combined flag
          cat > /tmp/fake-bin/curl << 'CURLEOF'
          #!/bin/sh
          # Parse args to find output file and URL
          out=""
          use_url_name=false
          prev=""
          url=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            case "$arg" in
              -o|--output) ;;
              # Handle combined flags containing O (e.g. -LOv, -O, -LO)
              -*O*) use_url_name=true ;;
              http*|https*) url="$arg" ;;
            esac
            prev="$arg"
          done
          # If -O flag (or combined), derive filename from URL
          if $use_url_name && [ -n "$url" ]; then
            out="$(basename "$url")"
          fi
          # Check if this is a request for the release tarball
          for arg in "$@"; do
            case "$arg" in
              *send-google-chat-webhook*releases*)
                echo "Fake curl: serving tarball for $arg" >&2
                if [ -n "$out" ]; then
                  cp /tmp/send-google-chat-webhook_0.0.2_linux_amd64.tar.gz "$out"
                else
                  cat /tmp/send-google-chat-webhook_0.0.2_linux_amd64.tar.gz
                fi
                exit 0
                ;;
            esac
          done
          exec /usr/bin/curl "$@"
          CURLEOF
          chmod +x /tmp/fake-bin/curl

          # Add fake-bin to GITHUB_PATH so composite action steps inherit it
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Run action with invalid webhook URL (expect failure)
        id: action
        continue-on-error: true
        uses: .
        with:
          webhook_url: 'https://invalid.example.com/webhook'

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid webhook URL, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid webhook URL"
